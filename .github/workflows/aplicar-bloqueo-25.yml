name: Aplicar bloqueo inicial de 25 dias

on:
  push:
    branches:
      - agent/bloqueo-inicial-25-dias
    paths:
      - .github/workflows/aplicar-bloqueo-25.yml

permissions:
  contents: write

jobs:
  aplicar-parche:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/bloqueo-inicial-25-dias
          fetch-depth: 0

      - name: Cambiar latencia de 45 a 25 dias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path("app_emergencia_core.py")
          main_path = Path("app_emergencia.py")

          core = core_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "# - LATENCIA INICIAL: Bloqueo estricto de emergencia los primeros 45 días del año.",
                  "# - LATENCIA INICIAL: Bloqueo estricto de emergencia los primeros 25 días del año.",
              ),
              (
                  'df_sim.loc[df_sim["Julian_days"] <= 45, "EMERREL_RAW"] = 0.0',
                  'df_sim.loc[df_sim["Julian_days"] <= 25, "EMERREL_RAW"] = 0.0',
              ),
              (
                  '(df_sim["Julian_days"] > 45)',
                  '(df_sim["Julian_days"] > 25)',
              ),
              (
                  'mask_ruptura = (df["Julian_days"] > 45)',
                  'mask_ruptura = (df["Julian_days"] > 25)',
              ),
              (
                  "# Bloqueo estricto final de latencia temprana (Primeros 45 días del año)",
                  "# Bloqueo estricto final de latencia temprana (Primeros 25 días del año)",
              ),
              (
                  'df.loc[df["Julian_days"] <= 45, "EMERREL"] = 0.0',
                  'df.loc[df["Julian_days"] <= 25, "EMERREL"] = 0.0',
              ),
          ]

          for old, new in replacements:
              count = core.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Se esperaba una coincidencia para {old!r}, pero se encontraron {count}."
                  )
              core = core.replace(old, new, 1)

          core_path.write_text(core, encoding="utf-8")

          main = main_path.read_text(encoding="utf-8")
          old_report = (
              '                45,\n'
              '                5,\n'
              '                globals().get("umbral_termoinhibicion", ""),'
          )
          new_report = (
              '                25,\n'
              '                5,\n'
              '                globals().get("umbral_termoinhibicion", ""),'
          )
          if main.count(old_report) != 1:
              raise RuntimeError("No se encontró de forma única el valor de latencia del reporte.")
          main_path.write_text(main.replace(old_report, new_report, 1), encoding="utf-8")
          PY

      - name: Validar sintaxis y cambios
        shell: bash
        run: |
          python -m py_compile app_emergencia_core.py app_emergencia.py
          grep -n 'Julian_days.*25' app_emergencia_core.py
          grep -n 'primeros 25 días\|Primeros 25 días' app_emergencia_core.py

      - name: Retirar workflow temporal y publicar cambios
        shell: bash
        run: |
          rm .github/workflows/aplicar-bloqueo-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_emergencia_core.py app_emergencia.py .github/workflows/aplicar-bloqueo-25.yml
          git commit -m "Reduce bloqueo inicial a 25 dias"
          git push origin HEAD:agent/bloqueo-inicial-25-dias
