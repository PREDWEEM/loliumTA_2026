name: Aplicar umbral primer pico 0.20

on:
  push:
    branches:
      - agent/umbral-primer-pico-020
    paths:
      - .github/workflows/apply_umbral_020.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/umbral-primer-pico-020
          fetch-depth: 0

      - name: Actualizar umbral y validar sustituciones
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app_emergencia_core.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "# - PRIMER PICO VÁLIDO: La campaña se habilita únicamente cuando EMERREL > 0.70.":
                  "# - PRIMER PICO VÁLIDO: La campaña se habilita únicamente cuando EMERREL > 0.20.",
              "UMBRAL_PRIMER_PICO = 0.70":
                  "UMBRAL_PRIMER_PICO = 0.20",
              "# La campaña comienza en el primer valor estrictamente superior a 0.70.":
                  "# La campaña comienza en el primer valor estrictamente superior a 0.20.",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Se esperaba 1 coincidencia y se encontraron {count}: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app_emergencia_core.py app_emergencia.py
          rm .github/workflows/apply_umbral_020.yml

      - name: Confirmar cambio en la rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_emergencia_core.py .github/workflows/apply_umbral_020.yml
          git commit -m "Reduce umbral del primer pico a 0.20"
          git push origin agent/umbral-primer-pico-020
