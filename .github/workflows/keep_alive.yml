name: Despertar Streamlit diariamente

on:
  schedule:
    # Se ejecuta a las 00:00 y a las 12:00 UTC para asegurar actividad constante
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Esto permite que tú lo actives manualmente cuando quieras

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la URL de Streamlit
        run: |
          curl -I https://appemergenciapy-evagabxskaw7cqvwex2d3k.streamlit.app/
